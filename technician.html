<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Technician — Raja Refrigeration</title><link rel="stylesheet" href="style.css"></head>
<body><main><section><div class="wrap" style="max-width:480px">
<h2>🧑‍🔧 Technician Location Sharing</h2>
<div id="loadingMsg" class="panel"><p>Load ho raha hai...</p></div>
<div id="techPanel" class="panel" style="display:none">
  <p>नमस्ते, <b id="techNameShow"></b> 👋</p>
  <p style="color:var(--muted);font-size:14px">जब आप किसी complaint के लिए जा रहे हों, तो नीचे का बटन दबाएं — ऑफिस को आपकी location दिखेगी। काम खत्म होने पर "Stop" दबा दें (battery बचाने के लिए)।</p>
  <button class="btn" id="startBtn">📍 Location Sharing Start Karein</button>
  <button class="btn" id="stopBtn" style="background:#c0392b;display:none">⏹ Stop Karein</button>
  <div id="shareStatus" style="margin-top:14px;font-weight:600"></div>
</div>
<div id="errorMsg" class="panel" style="display:none"><p>❌ Link galat hai ya technician nahi mila. Office se sahi link lein.</p></div>
</div></section></main>
<script type="module" src="technician.js"></script>
</body></html>
