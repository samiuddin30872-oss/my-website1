<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Raja Refrigeration Admin</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .admin-box {
      max-width: 1100px;
      margin: auto;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    .stat {
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      text-align: center;
      background: #fff;
    }

    .stat b {
      display: block;
      font-size: 24px;
      margin-top: 5px;
    }

    .search-box {
      width: 100%;
      padding: 12px;
      margin: 10px 0 20px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .complaint-card {
      margin: 15px 0;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fff;
    }

    .complaint-card h3 {
      margin-top: 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .actions a,
    .actions button {
      padding: 9px 12px;
      border-radius: 7px;
      text-decoration: none;
      cursor: pointer;
      border: 0;
    }

    .call-btn {
      background: #e8f5e9;
    }

    .whatsapp-btn {
      background: #e8f5e9;
    }

    .photo-btn {
      background: #e3f2fd;
    }

    .status-select,
    .technician-select {
      padding: 9px;
      border-radius: 7px;
      border: 1px solid #ccc;
      margin-top: 5px;
      width: 100%;
      max-width: 300px;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<main>
<section>
<div class="wrap admin-box">

  <h2>🔐 Raja Refrigeration Admin</h2>

  <!-- Login -->
  <form id="login">

    <label>
      Email
      <input id="email" type="email" required>
    </label>

    <label>
      Password
      <input id="password" type="password" required>
    </label>

    <button class="btn" type="submit">
      Login
    </button>

    <div id="loginResult"></div>

  </form>

  <!-- Dashboard -->
  <div id="dashboard" style="display:none">

    <div id="topActions"></div>

    <h2>📋 Complaints Dashboard</h2>

    <!-- Statistics -->
    <div class="stats">

      <div class="stat">
        Total
        <b id="totalCount">0</b>
      </div>

      <div class="stat">
        Pending
        <b id="pendingCount">0</b>
      </div>

      <div class="stat">
        In Progress
        <b id="progressCount">0</b>
      </div>

      <div class="stat">
        Completed
        <b id="completedCount">0</b>
      </div>

    </div>

    <!-- Search -->
    <input
      id="search"
      class="search-box"
      type="search"
      placeholder="🔎 Complaint No, नाम, मोबाइल या service खोजें..."
    >

    <button class="btn" id="refresh" type="button">
      🔄 Refresh
    </button>

    <div id="list">
      Complaints load हो रही हैं...
    </div>

  </div>

</div>
</section>
</main>

<script type="module" src="admin.js"></script>

</body>
</html>
